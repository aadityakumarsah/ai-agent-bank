<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentation for AI Agent Bank — a programmable financial permission layer for AI agents." />
    <meta name="color-scheme" content="light dark" />
    <title>AI Agent Bank Documentation</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aibank-docs-theme");
          var theme = stored === "dark" ? "dark" : stored === "light" ? "light" : null;
          if (!theme) {
            theme =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
