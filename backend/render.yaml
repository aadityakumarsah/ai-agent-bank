# Render Blueprint — AI Agent Bank API
# Deploys via Dockerfile for a pinned Python version (3.12) with prebuilt wheels.
# Runs in DEMO MODE with a SQLite database: no external keys, no DB required.

services:
  - type: web
    name: ai-agent-bank-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///services.db
      - key: SOLANA_RPC_URL
        value: ""
      - key: USE_REAL_PAYMENT
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Let the Cloudflare Pages dashboard call this API from the browser.
      - key: BACKEND_CORS_ORIGINS
        value: '["https://solbank.pages.dev","https://*.pages.dev"]'
